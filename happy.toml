[workspace]
setup_commands = [
  # Raw video sources in refs/ are gitignored (SPEC §9), so copy them from the project root, the checkout that owns the .git folder.
  "rsync -a --prune-empty-dirs --include='*/' --include='*.mp4' --include='*.mov' --exclude='*' \"$(git rev-parse --path-format=absolute --git-common-dir)/../refs/\" ./refs/",
  "bun install --frozen-lockfile",
]
